openapi: 3.0.0
info:
  title: Pet Store API
  description: A sample API for managing pets
  version: 1.0 # Issue: Not in semantic versioning format
  
servers:
  - url: https://api.example.com/petstore # Issue: Missing version in URL
    description: Production server
    
tags:
  - name: pets
    description: Pet operations
  - name: stores
    description: Store operations
    
paths:
  /Pets: # Issue: Not kebab-case
    get:
      # Issue: Missing description
      # Issue: Missing tags
      operationId: GetAllPets # Issue: Not camelCase starting with lowercase
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
              # Issue: Missing examples
  
  /pets/{petId}:
    get:
      description: Returns a pet by ID
      tags:
        - pets
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              examples:
                petExample:
                  value:
                    id: 1
                    name: Fluffy
                    status: available
                    
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum:
            - available
            - pending
            - sold
      required:
        - id
        - name 