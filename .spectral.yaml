extends: spectral:oas
rules:
  # Enforce consistent naming for paths 
  path-kebab-case:
    description: Path segments must use kebab-case
    severity: error
    given: $.paths.*~
    then:
      function: pattern
      functionOptions:
        match: ^(\/[a-z0-9-]+|\/\{[a-zA-Z0-9]+\})+$

  # Enforce description for all operations
  operation-description:
    description: Operation must have a description
    severity: error
    given: $.paths.*[?(@.get || @.put || @.post || @.delete || @.options || @.head || @.patch || @.trace)]
    then:
      field: description
      function: truthy

  # Enforce tags for all operations
  operation-tags:
    description: Operation must have tags
    severity: error
    given: $.paths.*[?(@.get || @.put || @.post || @.delete || @.options || @.head || @.patch || @.trace)]
    then:
      field: tags
      function: truthy

  # Ensure operation IDs are unique and properly formatted
  operation-operationId:
    description: Operation must have a properly formatted operationId
    severity: error
    given: $.paths.*[?(@.get || @.put || @.post || @.delete || @.options || @.head || @.patch || @.trace)]
    then:
      field: operationId
      function: pattern
      functionOptions:
        match: ^[a-z][a-zA-Z0-9]+$

  # Enforce response examples
  response-examples:
    description: Response objects must have examples
    severity: warn
    given: $.paths.*.*.responses.*.content.*
    then:
      field: examples
      function: truthy

  # Enforce proper versioning in the servers URL
  servers-url-version:
    description: Servers URL should include API version
    severity: error
    given: $.servers[*].url
    then:
      function: pattern
      functionOptions:
        match: v[0-9]+

  # Enforce version format in info object
  api-version-format:
    description: API version must be in semantic versioning format
    severity: error
    given: $.info.version
    then:
      function: pattern
      functionOptions:
        match: ^[0-9]+\.[0-9]+\.[0-9]+$ 